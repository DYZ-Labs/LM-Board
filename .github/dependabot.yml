version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # eslint-config-next 15 supports ESLint through v9 only.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # Next.js 15 cannot load its TypeScript config with newer major versions.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
