name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate data and build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://www.checklmboard.xyz
          NEXT_PUBLIC_GITHUB_REPOSITORY_URL: https://github.com/DYZ-Labs/LM-Board
        run: npm run build

      - name: Check homepage HTML budget
        env:
          MAX_HOMEPAGE_BYTES: "1048576"
        run: |
          page_bytes=$(wc -c < out/index.html)
          echo "Homepage HTML: $page_bytes bytes (limit: $MAX_HOMEPAGE_BYTES)"
          if [ "$page_bytes" -gt "$MAX_HOMEPAGE_BYTES" ]; then
            echo "::error::Homepage HTML exceeds the 1 MiB budget."
            exit 1
          fi

      # Transfer-size budgets plus a content smoke check: a build that rendered
      # an empty board would pass every byte budget on its own.
      - name: Check design-system budgets and page content
        run: npm run measure -- --check
