name: Monitor production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check production surfaces
        id: monitor
        env:
          MONITOR_BASE_URL: https://www.checklmboard.xyz
        run: >-
          node --experimental-strip-types scripts/monitor-production.ts
          --report "$RUNNER_TEMP/production-monitor.md"

      - name: Publish monitor summary
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/production-monitor.md" ]]; then
            cat "$RUNNER_TEMP/production-monitor.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The monitor stopped before it could write a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update deduplicated incident
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_TITLE: "[production-monitor] LM Board production is unhealthy"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body_file="$RUNNER_TEMP/production-monitor-issue.md"
          {
            echo "The scheduled production monitor failed."
            echo
            echo "Latest run: $RUN_URL"
            echo
            if [[ -f "$RUNNER_TEMP/production-monitor.md" ]]; then
              cat "$RUNNER_TEMP/production-monitor.md"
            else
              echo "The workflow failed before a route report was available."
            fi
          } > "$body_file"

          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "\"$INCIDENT_TITLE\" in:title" --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[production-monitor] LM Board production is unhealthy") | .number' \
              | head -n 1
          )"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --assignee thedanielyuan --label bug \
              --title "$INCIDENT_TITLE" --body-file "$body_file"
          fi

      - name: Close recovered incident
        if: ${{ success() && steps.monitor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_TITLE: "[production-monitor] LM Board production is unhealthy"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_number="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "\"$INCIDENT_TITLE\" in:title" --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[production-monitor] LM Board production is unhealthy") | .number' \
              | head -n 1
          )"

          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --reason completed \
              --comment "Production recovered. Healthy run: $RUN_URL"
          fi
